<style>
/* Estetica nativa 96A */
#qc-nr-fixed{width:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 6px 0;padding:12px 14px;background:#fffaf0;border:1px solid #e7dcc9;border-radius:16px;font-size:13px;font-weight:700;clear:both}
#qc-nr-fixed button{padding:8px 14px;border-radius:999px;border:1px solid #e7dcc9;background:#ffffff;color:#111827;font-weight:800;font-size:13px;cursor:pointer;transition:.15s;line-height:1}
#qc-nr-fixed button.active{background:#111827;color:#fffaf0;border-color:#111827;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#qc-nr-fixed #qc-nr-info{margin-left:auto;opacity:.5;font-weight:600;font-size:11px}
#qc-turnos-btn{height:48px;padding:0 18px;border-radius:12px;border:1px solid #e7dcc9;background:#ffffff;color:#111827;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#qc-turnos-btn:hover{background:#fffaf0}
#qc-turnos-modal{position:fixed;inset:0;z-index:10000;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;padding:16px}
#qc-turnos-modal.open{display:flex}
#qc-turnos-box{background:#fef7ed;border:1px solid #e7dcc9;border-radius:16px;width:100%;max-width:420px;padding:18px;box-shadow:0 16px 40px rgba(0,0,0,.25)}
#qc-turnos-box h3{font-weight:900;font-size:16px;margin:0 0 12px 0}
.qc-turno-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed #e7dcc9}
.qc-turno-row label{font-weight:800;font-size:13px;text-transform:uppercase}
.qc-turno-row select{padding:8px 12px;border-radius:12px;border:1px solid #e7dcc9;background:#fff;font-weight:700;font-size:13px}

    <button id="qc-tools-close">✕</button>

      <button data-tab="backup" class="active">💾 Backup</button>

          <button id="qc-backup-btn">⬇️ Exportar backup</button>
          <input type="file" id="qc-restore-file" accept=".json" style="display:none">
          <button id="qc-restore-btn" style="padding:10px 14px;border-radius:12px;background:#fff;border:1px solid #e7dcc9;font-weight:800;font-size:12px;cursor:pointer">⬆️ Restaurar backup</button>

      <div class="qc-tool-section">

        <textarea id="qc-import-text" placeholder='[ {&quot;nombre&quot;:&quot;...&quot;} ]' style="width:100%;height:120px;border:1px solid #e7dcc9;border-radius:12px;padding:8px;font-size:11px;font-family:monospace"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">

<div id="qc-turnos-modal"><div id="qc-turnos-box"><h3>👩 Turnos de la semana</h3><div id="qc-turnos-list"></div><div style="display:flex;gap:8px;margin-top:14px"><button id="qc-turnos-save" style="flex:1;padding:10px;border-radius:999px;background:#111827;color:#fef7ed;border:1px solid #111827;font-weight:800">Guardar</button><button id="qc-turnos-close" style="flex:1;padding:10px;border-radius:999px;background:#fff;color:#111827;border:1px solid #e7dcc9;font-weight:800">Cerrar</button></div><p style="font-size:11px;opacity:.6;margin-top:10px">Doblaje: no come, sí cena · Guardia: ni come ni cena</p></div></div>

<script>
(function(){
const KEY_W='qc-no-repeat-weeks', KEY_H='qc-historial', KEY_T='qc-turnos-semana', KEY_CD='qc-comensales-dia', KEY_CUR='qc-dia-actual';
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const TURNOS=['Mañana','Tarde','Guardia','Doblaje','Libre'];
const getW=()=>+localStorage.getItem(KEY_W)||0;
const setW=v=>localStorage.setItem(KEY_W,v);
const getH=()=>{try{return JSON.parse(localStorage.getItem(KEY_H)||'{}')}catch{return {}}};
const setH=o=>localStorage.setItem(KEY_H, JSON.stringify(o));
const getT=()=>{try{return JSON.parse(localStorage.getItem(KEY_T)||'{}')}catch{return {}}};
const setT=o=>localStorage.setItem(KEY_T, JSON.stringify(o));
const getStore=()=>{try{const v=localStorage.getItem('que-comemos-expert-v2')||localStorage.getItem('que-comemos-expert-v1');return v?JSON.parse(v):null}catch{return null}};
const getCD=()=>{try{return JSON.parse(localStorage.getItem(KEY_CD)||'{}')}catch{return {}}};
const setCD=o=>localStorage.setItem(KEY_CD, JSON.stringify(o));

const getBase=()=>{try{return getStore()?.comensales||4}catch{return 4;}};
function initTools(){
  const btn=document.getElementById('qc-tools-btn');
  const modal=document.getElementById('qc-tools-modal');
  const close=document.getElementById('qc-tools-close');
  if(!btn||!modal) return false;
  btn.onclick=()=>{ modal.classList.add('open'); updateInfo(); };
  close.onclick=()=>modal.classList.remove('open');
  modal.onclick=(e)=>{ if(e.target.id==='qc-tools-modal') modal.classList.remove('open'); };
  const tabs=document.querySelectorAll('#qc-tools-tabs button');
  tabs.forEach(b=>{
    b.onclick=()=>{
      tabs.forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('qc-tool-backup').style.display = b.dataset.tab==='backup' ? 'block' : 'none';
      document.getElementById('qc-tool-import').style.display = b.dataset.tab==='import' ? 'block' : 'none';
    };
  });
  document.getElementById('qc-restore-file') && (document.getElementById('qc-restore-btn').onclick=()=>document.getElementById('qc-restore-file').click());
  initImporter();
  updateInfo();
  return true;
}
function updateInfo(){
  const s=getStore();
  const info=document.getElementById('qc-info');
  if(!info) return;
  if(!s){ info.textContent='No hay datos'; return; }
  info.innerHTML = `<b>${(s.recetas||[]).length}</b> recetas<br><b>${(s.menu||[]).length}</b> días menú<br>Comensales base: <b>${s.comensales||2}</b><br>Turnos: ${Object.keys(getT()).length} días<br>Historial: ${Object.keys(getH()).length} platos<br>Ajustes día: ${Object.keys(getCD()).length} días`;
}
let pendingImport=[];
function normalizeReceta(r,i){
  const id=Date.now()+i+Math.floor(Math.random()*1000);
  return { id:id, nombre:(r.nombre||r.titulo||'Receta importada').slice(0,80), emoji:r.emoji||'🍽️', tipo:r.tipo||'principal', grupo:r.grupo||'otro', temporada:r.temporada||'todo_año', momento:r.momento||'ambas', necesitaAcomp:!!r.necesitaAcomp, kcal:+r.kcal||200, prot:+r.prot||10, grasa:+r.grasa||8, hc:+r.hc||15, ing:Array.isArray(r.ing)?r.ing: (r.ingredientes||[]).map(x=> typeof x==='string'?{n:x,c:1,u:'ud'}:x ), aptaExpert:!!r.aptaExpert, tiempoClasico:r.tiempoClasico||r.tiempo||'20min', tiempoExpert:r.tiempoExpert||'', pasosClasico:Array.isArray(r.pasosClasico)?r.pasosClasico: (r.pasos||r.instrucciones||[]), pasosExpert:Array.isArray(r.pasosExpert)?r.pasosExpert:[] };
}
function initImporter(){
  const fileInput=document.getElementById('qc-import-file');
  const textArea=document.getElementById('qc-import-text');
  const previewBtn=document.getElementById('qc-import-preview');
  const importBtn=document.getElementById('qc-import-btn');
  const status=document.getElementById('qc-import-status');
  const dupesDiv=document.getElementById('qc-import-dupes');
  if(!fileInput) return;
  fileInput.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; textArea.value=await f.text(); };
  previewBtn.onclick=()=>{ let txt=textArea.value.trim(); if(!txt){ status.textContent='Pega JSON primero'; return; } try{ let j=JSON.parse(txt); pendingImport=Array.isArray(j)?j:[j]; status.textContent='Detectadas '+pendingImport.length+' recetas ✓'; dupesDiv.style.display='none'; }catch(err){ status.textContent='JSON inválido: '+err.message; } };
  importBtn.onclick=()=>{
    if(!pendingImport.length){ try{ let j=JSON.parse(textArea.value); pendingImport=Array.isArray(j)?j:[j]; }catch(e){ status.textContent='JSON inválido'; return; } }
    const store=getStore(); if(!store){ status.textContent='Abre app una vez'; return; }
    const baseR=store.recetas||[]; const baseByName={}; baseR.forEach(r=>{ baseByName[r.nombre.toLowerCase().trim()]=r; });
    const newOnes=[]; const dupes=[];
    pendingImport.forEach((r,i)=>{ const norm=normalizeReceta(r,i); const key=norm.nombre.toLowerCase().trim(); if(baseByName[key]) dupes.push({existing:baseByName[key], incoming:norm}); else newOnes.push(norm); });
    if(dupes.length){
      dupesDiv.style.display='block';
      dupesDiv.innerHTML='<b>Existen ('+dupes.length+'):</b>' + dupes.map((d,idx)=>`<div style="border:1px solid #e7dcc9;border-radius:10px;padding:8px;margin:6px 0;background:#fffaf0"><b>${d.existing.nombre}</b><br><label style="font-size:11px"><input type="radio" name="dupe-${idx}" value="skip" checked> Omitir</label><label style="font-size:11px;margin-left:8px"><input type="radio" name="dupe-${idx}" value="replace"> Modificar</label><label style="font-size:11px;margin-left:8px"><input type="radio" name="dupe-${idx}" value="add"> Añadir (2)</label></div>`).join('') + `<button id="qc-dupe-confirm" style="margin-top:6px;padding:8px 12px;border-radius:10px;background:#111827;color:#fff;font-weight:700">Confirmar</button>`;
      document.getElementById('qc-dupe-confirm').onclick=()=>{
        let finalRecetas=[...baseR, ...newOnes];
        dupes.forEach((d,idx)=>{ const sel=document.querySelector(`input[name="dupe-${idx}"]:checked`).value; if(sel==='skip') return; if(sel==='add'){ finalRecetas.push({...d.incoming, nombre:d.incoming.nombre+' (2)', id:Date.now()+idx+10000}); } if(sel==='replace'){ const i=finalRecetas.findIndex(r=>r.nombre.toLowerCase().trim()===d.existing.nombre.toLowerCase().trim()); if(i>=0) finalRecetas[i]={...finalRecetas[i], ...d.incoming, id:finalRecetas[i].id}; } });
        store.recetas=finalRecetas; saveStore(store); status.textContent='✅ Total: '+finalRecetas.length+'. Recargando...'; setTimeout(()=>location.reload(),900);
      };
      status.textContent='Hay '+dupes.length+' duplicadas abajo + '+newOnes.length+' nuevas.';
    }else{ store.recetas=[...baseR, ...newOnes]; saveStore(store); status.textContent='✅ Importadas '+newOnes.length+'. Total '+store.recetas.length; setTimeout(()=>location.reload(),800); }
  };
}

function initReplica(){let cd=getCD(); const base=getBase(); let ch=false; DIAS.forEach((_,i)=>{ if(!cd[i]){ cd[i]={comida:base,cena:base}; ch=true; } }); if(ch) setCD(cd);}
function applyTurnos(){const t=getT(); const base=getBase(); let cd=getCD(); if(!Object.keys(cd).length) initReplica(); cd=getCD(); DIAS.forEach((_,i)=>{const turno=t[i]; if(turno==='Guardia') cd[i]={comida:Math.max(1,base-1),cena:Math.max(1,base-1)}; else if(turno==='Doblaje') cd[i]={comida:Math.max(1,base-1),cena:base}; else cd[i]={comida:base,cena:base};}); setCD(cd);}
initReplica(); applyTurnos();
window.qcGetComensales=()=>{try{const cur=JSON.parse(localStorage.getItem(KEY_CUR)||'null'); if(!cur) return null; const cd=getCD(); return cd[cur.diaIdx]?.[cur.tipo]||null;}catch{return null;}};
window.qcGetComensalesDia=(diaIdx,tipo)=>{try{if(typeof diaIdx==='undefined'){const cur=JSON.parse(localStorage.getItem(KEY_CUR)||'null'); if(!cur) return null; diaIdx=cur.diaIdx; tipo=cur.tipo;} const cd=getCD(); return cd[diaIdx]?.[tipo]||null;}catch{return null;}};

document.getElementById('qc-backup-btn').onclick=()=>{
 const data={store:localStorage.getItem('que-comemos-expert-v2'), historial:getH(), noRepeat:getW(), turnos:getT(), comensalesDia:getCD(), fecha:new Date().toISOString()};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='que-comemos-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
};
function injectAll(force){
 const gen=[...document.querySelectorAll('button')].find(b=>/generar semana/i.test(b.textContent));
 if(!gen) return false;
 // Find container that has Temporada selector - more robust for mobile (no width check)
 let container=gen.closest('div');
 for(let i=0;i<6;i++){ if(!container) break; if(container.textContent.includes('Temporada') && container.textContent.includes('Generar semana')) break; container=container.parentElement; }
 const target=container || gen.parentElement;

 // ---- No repetir bar ----
 let bar=document.getElementById('qc-nr-fixed');
 if(!bar){
  bar=document.createElement('div');
  bar.id='qc-nr-fixed';
  bar.innerHTML=`<span>🚫 No repetir en:</span><button data-w="0">Off</button><button data-w="7">1 sem</button><button data-w="14">2 sem</button><button data-w="21">3 sem</button><span id="qc-nr-info"></span>`;
  // Insert after target, but ensure visible
  if(target && target.parentNode) target.parentNode.insertBefore(bar, target.nextSibling);
  else gen.parentNode.insertBefore(bar, gen.parentNode.firstChild);
 }
 const refreshNR=()=>{
  const w=getW();
  const info=document.getElementById('qc-nr-info');
  bar.querySelectorAll('button').forEach(b=>b.classList.toggle('active', +b.dataset.w===w));
  if(info) info.textContent=w? 'Filtrando <'+w+'d · chivato activo' : 'Sin filtro · solo chivato';
 };
 refreshNR();
 bar.querySelectorAll('button').forEach(b=>{ if(!b._qc){ b._qc=true; b.onclick=()=>{setW(b.dataset.w);refreshNR();}; } });

 // ---- Turnos btn ----
 let tbtn=document.getElementById('qc-turnos-btn');
 if(!tbtn){
  tbtn=document.createElement('button');
  tbtn.id='qc-turnos-btn'; tbtn.textContent='👩 Turnos';
  tbtn.onclick=()=>{ buildModal(); document.getElementById('qc-turnos-modal').classList.add('open'); };
  // On mobile, gen.parentNode may be flex-wrap, insert after gen with margin
  try{
    if(gen.parentNode){
      gen.parentNode.insertBefore(tbtn, gen.nextSibling);
      tbtn.style.marginLeft='8px';
      tbtn.style.marginTop='6px';
      tbtn.style.flexShrink='0';
    }
  }catch{}
 }
 return true;
}
function buildModal(){const list=document.getElementById('qc-turnos-list'); const t=getT(); list.innerHTML=''; DIAS.forEach((d,i)=>{const row=document.createElement('div'); row.className='qc-turno-row'; row.innerHTML=`<label>${d}</label><select data-i="${i}">${TURNOS.map(v=>`<option value="${v}" ${t[i]===v?'selected':''}>${v}</option>`).join('')}</select>`; list.appendChild(row);});}
let triesTools=0; const ivTools=setInterval(()=>{ triesTools++; if(initTools()||triesTools>50) clearInterval(ivTools); },600);
let tries=0; const iv=setInterval(()=>{ tries++; if(injectAll()||tries>40) clearInterval(iv); },700);
setInterval(()=>{ injectAll(true); },2000);
document.getElementById('qc-turnos-save').onclick=()=>{const o={}; document.querySelectorAll('#qc-turnos-list select').forEach(s=>{ o[s.dataset.i]=s.value; }); setT(o); document.getElementById('qc-turnos-modal').classList.remove('open'); applyTurnos(); renderBanners();};
document.getElementById('qc-turnos-close').onclick=()=>document.getElementById('qc-turnos-modal').classList.remove('open');
document.getElementById('qc-turnos-modal').onclick=(e)=>{ if(e.target.id==='qc-turnos-modal') e.currentTarget.classList.remove('open'); };
document.addEventListener('click', (e)=>{
  const btn=e.target.closest('button'); if(!btn) return;
  if(['qc-turnos-btn','qc-backup-btn','qc-turnos-save','qc-turnos-close'].includes(btn.id)) return;
  const headers=[...document.querySelectorAll('div, h3, h4, h2')].filter(el=>{const txt=(el.textContent||'').trim(); return DIAS.includes(txt) || DIAS.map(d=>d.toUpperCase()).includes(txt.toUpperCase());});
  let best=null, bestDist=Infinity; const r1=btn.getBoundingClientRect();
  headers.forEach(h=>{const r2=h.getBoundingClientRect(); const dist=r1.top - r2.top; if(dist>=0 && dist<bestDist){ bestDist=dist; best=h; }});
  if(best){const raw=best.textContent.trim(); const diaIdx=DIAS.findIndex(d=>d.toUpperCase()===raw.toUpperCase() || d===raw); if(diaIdx>=0){const dayBlock=best.parentElement; if(dayBlock){const allBtns=[...dayBlock.querySelectorAll('button')].filter(b=>b.offsetParent!==null && b.textContent.length<80); const idx=allBtns.indexOf(btn); const tipo = idx >= Math.ceil(allBtns.length/2)? 'cena' : 'comida'; const t=getT(); const turno=t[diaIdx]||''; window.qcTurnoLabel = turno? ` (${turno})` : ''; if(turno==='Guardia') window.qcTurnoLabel=` (-1 por Guardia)`; if(turno==='Doblaje' && tipo==='comida') window.qcTurnoLabel=` (-1 por Doblaje)`; localStorage.setItem(KEY_CUR, JSON.stringify({diaIdx, tipo}));}} }
}, true);
function renderBanners(){const t=getT(); document.querySelectorAll('.qc-turno-banner').forEach(b=>b.remove()); const all=[...document.querySelectorAll('div, h2, h3, h4, span')]; DIAS.forEach((dia,i)=>{const turno=t[i]; if(!turno) return; const upper=dia.toUpperCase(); const header=all.find(el=>{ const txt=(el.textContent||'').trim().toUpperCase(); return (txt===upper) && el.offsetParent!==null && el.children.length===0; }); let container=header? header.parentElement : null; if(!container){const cand=all.find(el=> (el.textContent||'').toUpperCase().includes(upper) && (el.textContent||'').includes('Comida')); if(cand) container=cand;} if(container){const banner=document.createElement('div'); banner.className='qc-turno-banner '+turno.toLowerCase(); let txt='👩 '+turno; if(turno==='Guardia') txt='👩 Guardia (-1 comida y cena)'; else if(turno==='Doblaje') txt='👩 Doblaje (-1 comida)'; banner.textContent=txt; if(header) header.parentNode.insertBefore(banner, header.nextSibling); else container.prepend(banner);}});}
setInterval(()=>{ renderBanners(); },1000);

// FIX FINAL: Recetas = general (sin Guardia), Menu = por turno, ingredientes visibles
(function(){
  const KEY_CUR='qc-dia-actual';
  const getGeneral=()=>{ try{ const s=JSON.parse(localStorage.getItem('que-comemos-expert-v2')||localStorage.getItem('que-comemos-expert-v1')||'{}'); return s.comensales||4; }catch{return 4;} };

  let orig=null;
  const patch=setInterval(()=>{
    if(!window.qcGetComensales || window.qcGetComensales._patchedFinal) return;
    orig=window.qcGetComensales;
    const patched=function(){
      try{
        const btn=document.querySelector('button[data-tab="recetas"]');
        const isRecetas=btn && btn.className.includes('ff7a1a');
        if(isRecetas){
          return getGeneral(); // En recetas, usa general, no per-day
        }
        return orig();
      }catch(e){ return orig(); }
    };
    patched._patchedFinal=true;
    window.qcGetComensales=patched;
    clearInterval(patch);
  },300);

  function clearIfRecetas(){
    const btn=document.querySelector('button[data-tab="recetas"]');
    const isRecetas=btn && btn.className.includes('ff7a1a');
    if(isRecetas){
      window.qcTurnoLabel='';
      try{ localStorage.removeItem(KEY_CUR); }catch{}
    }
  }
  setInterval(clearIfRecetas, 800);

  function attachTabs(){
    document.querySelectorAll('button[data-tab]').forEach(b=>{
      if(b._fixFinal) return;
      b._fixFinal=true;
      b.addEventListener('click',()=>{
        setTimeout(()=>{
          if(b.dataset.tab==='recetas'){
            window.qcTurnoLabel='';
            try{ localStorage.removeItem(KEY_CUR);}catch{}
          }
        },150);
      });
    });
  }
  setInterval(attachTabs, 800);
})();


// PUNTO 6 - EDITOR INTEGRADO EN HEADER - sin barra gris, sin romper Turnos
(function(){
  window.qcLocalReceta = window.qcLocalReceta || {};
  const getGeneral=()=>{ try{ const s=JSON.parse(localStorage.getItem('que-comemos-expert-v2')||localStorage.getItem('que-comemos-expert-v1')||'{}'); return s.comensales||4; }catch{return 4;} };

  function patchHeader(){
    const btnRecetas=document.querySelector('button[data-tab="recetas"]');
    const isRecetas=btnRecetas && btnRecetas.className.includes('ff7a1a');
    if(!isRecetas) return;
    document.querySelectorAll('div').forEach(header=>{
      const txt=(header.textContent||'').trim();
      if(!txt.startsWith('Ingredientes x')) return;
      if(header._p6) return;
      if(!header.className.includes('font-bold') || !header.className.includes('15px')) return;
      if(header.querySelector('button')) return;
      const ingList=header.nextElementSibling;
      if(!ingList || !ingList.className.includes('space-y-1')) return;
      const first=ingList.querySelector('span')?.textContent?.trim().toLowerCase()||'';
      let rec=null;
      try{
        const store=JSON.parse(localStorage.getItem('que-comemos-expert-v2')||localStorage.getItem('que-comemos-expert-v1')||'{}');
        rec=(store.recetas||[]).find(r=>(r.ing||[])[0]?.n?.toLowerCase()===first);
        if(!rec){
          const names=[...ingList.querySelectorAll('div.flex.justify-between')].map(d=>d.querySelector('span')?.textContent?.trim().toLowerCase());
          let best=null,bs=0;
          for(let r of (store.recetas||[])){
            const rn=(r.ing||[]).map(i=>i.n.toLowerCase());
            const sc=names.filter(n=>rn.includes(n)).length;
            if(sc>bs){bs=sc; best=r;}
          }
          rec=best;
        }
      }catch{}
      if(!rec) return;
      header._p6=true;
      const recipeId=rec.id;
      const cur=window.qcLocalReceta[recipeId]|| getGeneral();
      const turnoLabel=window.qcTurnoLabel||'';
      header.innerHTML='';
      header.className='font-bold text-[15px] mb-2 flex items-center gap-2 flex-wrap';
      const t1=document.createTextNode('Ingredientes x ');
      const btnM=document.createElement('button');
      btnM.textContent='−';
      btnM.style.cssText='width:26px;height:26px;border-radius:999px;background:#111827;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none';
      const num=document.createElement('span');
      num.id='qc-num-'+recipeId;
      num.textContent=cur;
      num.style.cssText='min-width:18px;text-align:center;font-weight:900';
      const btnP=document.createElement('button');
      btnP.textContent='+';
      btnP.style.cssText='width:26px;height:26px;border-radius:999px;background:#111827;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none';
      const t2=document.createTextNode(' comensales'+turnoLabel);
      const update=(nv)=>{
        window.qcLocalReceta[recipeId]=nv;
        num.textContent=nv;
        const rows=[...ingList.querySelectorAll('div.flex.justify-between')];
        rows.forEach((row,i)=>{
          const ing=rec.ing[i]; if(!ing) return;
          const qty=row.querySelectorAll('span')[1];
          if(qty) qty.textContent=(Math.round(ing.c*nv*10)/10)+' '+ing.u;
        });
      };
      btnM.onclick=()=>{ let v=window.qcLocalReceta[recipeId]||getGeneral(); v=Math.max(1,v-1); update(v); };
      btnP.onclick=()=>{ let v=window.qcLocalReceta[recipeId]||getGeneral(); v=Math.min(20,v+1); update(v); };
      header.appendChild(t1);
      header.appendChild(btnM);
      header.appendChild(num);
      header.appendChild(btnP);
      header.appendChild(t2);
    });
  }
  setInterval(patchHeader, 800);
})();




})();
</script>

</body></html>
